<div class="portal-container">
  <div class="portal-title" matTooltip="Icarros" matTooltipPosition="above" matTooltipClass="custom-tooltip">
    {{portal.nome}}</div>
  <div class="portal-content">
     <label *ngFor="let pacote of portal.pacotes">
      <input
        type="checkbox"
        [value]="pacote.id"
        [checked]="pacote.id === pacoteSelecionadoId"
        (change)="selecionarPacote(pacote.id, $event)">
      {{ pacote.nome }}
    </label>
  </div>
</div>

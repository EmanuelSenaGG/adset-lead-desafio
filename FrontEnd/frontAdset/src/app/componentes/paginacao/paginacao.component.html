<nav class="pagination">
  <a href="#" (click)="irParaPagina(paginaAtual - 1)">&laquo;</a>
  <a href="#" *ngFor="let i of [].constructor(totalPaginas); let idx = index"
     [class.active]="idx+1 === paginaAtual"
     (click)="irParaPagina(idx+1)">
    {{ idx + 1 }}
  </a>
  <a href="#" (click)="irParaPagina(paginaAtual + 1)">&raquo;</a>
</nav>

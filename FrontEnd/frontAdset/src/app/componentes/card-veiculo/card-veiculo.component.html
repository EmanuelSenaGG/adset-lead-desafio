<article class="vehicle-card-v2">
  <div class="delete-tab">
    <i class="fas fa-trash-can"></i>
  </div>

  <div class="vehicle-image-container">
    <img src="../../../assets/carros/carro.jpg" alt="Foto do Veículo">
  </div>

  <div class="vehicle-content">
    <div class="content-header">
      <span class="vehicle-title">MARCA MODELO | ANO</span>
    </div>
    <div class="content-body">
      <div class="vehicle-details">
        <p>Placa - AAA-0102</p>
        <p>Km - 25.000</p>
        <p>Cor - Branco</p>
      </div>
      <div class="vehicle-actions-price">
        <button class="btn btn-edit">Editar Veículo</button>
        <div class="action-icons">
          <div class="icon-wrapper">
            <i class="fas fa-camera"></i>
            <span class="icon-badge">08</span>
          </div>
          <i class="fas fa-cogs"></i>
          <span>Opcionais</span>
        </div>
        <div class="vehicle-price">R$ 103.900,00</div>
      </div>
    </div>
  </div>

  <div class="status-container">
    <div class="status-tabs">
      <button class="status-tab active">iCarros</button>
      <button class="status-tab">WebMotors</button>
    </div>
    <div class="status-panels">
      <div class="status-panel active">
        <div class="status-icon-blue">i</div>
        <div class="status-arrows">
          <i class="fas fa-arrow-down text-success"></i>
          <i class="fas fa-arrow-up text-danger"></i>
        </div>
      </div>
      <div class="status-panel">
        <div class="status-icon-red">H</div>
        <div class="status-arrows">
            <i class="fas fa-arrow-down text-success"></i>
            <i class="fas fa-arrow-up text-danger"></i>
        </div>
      </div>
    </div>
  </div>
</article>

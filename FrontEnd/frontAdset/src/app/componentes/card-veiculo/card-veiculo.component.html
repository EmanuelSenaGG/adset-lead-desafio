<article class="vehicle-card-v2">
<app-botao-deletar></app-botao-deletar>

  <div class="vehicle-image-container">
    <img src="../../../assets/carros/carro.jpg" alt="Foto do Veículo">
  </div>

  <div class="vehicle-content">
    <div class="content-header">
      <span class="vehicle-title">MARCA MODELO | ANO</span>
    </div>
    <div class="content-body">
      <div class="vehicle-details">
        <p>Placa - <span class="text-success">AAA-0102</span></p>
        <p>Km - <span class="text-success">25.000</span></p>
        <p>Cor - <span class="text-success">Branco</span></p>
      </div>

      <div class="vehicle-actions-price">
        <div class="action-buttons">
          <div class="action-item">
            <i class="fas fa-pen-to-square icon-edit" matTooltip="Editar veículo" 
matTooltipPosition="above"
matTooltipClass="custom-tooltip"></i>
          </div>
          <div class="action-item">
            <i class="fas fa-camera"></i>
            <span class="action-label">8 Fotos</span>
          </div>
          <div class="action-item">
            <i class="fas fa-car"></i>
            <span class="action-label">Opcionais</span>
          </div>
        </div>
        <div class="vehicle-price">R$ 103.900,00</div>
      </div>
    </div>
  </div>

  <!-- Container para os Portais -->
  <div class="portals-row">
    <!-- iCarros -->
    <div class="portal-container">
      <div class="portal-title">iCarros</div>
      <div class="portal-content">
        <label><input type="checkbox"> Opção 1</label><br>
        <label><input type="checkbox"> Opção 2</label><br>
        <label><input type="checkbox"> Opção 3</label>
      </div>
    </div>

    <!-- WebMotors -->
    <div class="portal-container">
      <div class="portal-title">WebMotors</div>
      <div class="portal-content">
        <label><input type="checkbox"> Opção 1</label><br>
        <label><input type="checkbox"> Opção 2</label><br>
        <label><input type="checkbox"> Opção 3</label>
      </div>
    </div>
  </div>
</article>

<section class="filter-panel">
  <form class="filter-form" [formGroup]="filtroForm" (ngSubmit)="buscarClick()">
    <div class="fields-container">
      <div class="form-group">
        <label for="placa">Placa</label>
        <input type="text" id="placa" formControlName="placa">
      </div>
      <div class="form-group">
        <label for="marca">Marca</label>
        <input type="text" id="marca" formControlName="marca">
      </div>
      <div class="form-group">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" formControlName="modelo">
      </div>
      <div class="anos-container">
        <div class="form-group small-select">
          <label for="ano-min">Ano Mín</label>
          <select id="ano-min" formControlName="anoMin">
            <option value="">Selecione</option>
            <option *ngFor="let ano of anos" [value]="ano" #anoMin>{{ ano }}</option>
          </select>
        </div>

        <div class="form-group small-select2">
          <label for="ano-max">Ano Máx</label>
          <select id="ano-max" formControlName="anoMax">
            <option value="">Selecione</option>
            <option *ngFor="let ano of anos" [value]="ano" #anoMax>{{ ano }}</option>
          </select>
        </div>
      </div>

      <div class="form-group small-select">
        <label for="preco">Preço</label>
        <select id="preco" formControlName="preco">
          <option value="0">Selecione</option>
          <option *ngFor="let faixa of faixasPreco" [value]="faixa.valorMin">{{ faixa.label }}</option>
        </select>
      </div>

      <div class="form-group small-select">
        <label for="fotos">Fotos</label>
        <select id="fotos" formControlName="fotos">
          <option value="">Selecione</option>
          <option value="true">Com Fotos</option>
          <option value="false">Sem Fotos</option>
        </select>
      </div>
      <div class="form-group">
        <label for="opcionais">Opcionais</label>
        <input type="text" id="opcionais" formControlName="opcional">
      </div>
      <div class="form-group small-select">
        <label for="cor">Cor</label>
        <select id="cor" formControlName="cor">
          <option value="">Selecione</option>
          <option *ngFor="let cor of cores" [value]="cor">{{cor}}</option>
        </select>
      </div>

      <app-botao-limpar (click)="limparFiltros()"></app-botao-limpar>


    </div>
    <app-botao-buscar></app-botao-buscar>
  </form>

</section>

<section class="results-list">
  <div class="d-flex justify-content-between align-items-center mb-2" style="max-width: 820px; gap: 10px;">

    <div class="d-flex gap-3">
      <div class="clear-ordenacao">
        <i class="fas fa-sort me-1"></i>
        <app-botao-limpar (click)="ordenar('marcaModelo')" ></app-botao-limpar>
      </div>

      <a (click)="ordenar('marcaModelo')"><i class="fas fa-sort me-1"></i> Marca / Modelo</a>|
      <a (click)="ordenar('ano')"><i class="fas fa-sort me-1"></i> Ano</a> |
      <a (click)="ordenar('preco')"><i class="fas fa-sort me-1"></i>Preço</a>|
      <a (click)="ordenar('fotos')"><i class="fas fa-sort me-1"></i>Fotos</a>

    </div>
    <div class="d-flex align-items-center gap-2">

      <select id="exibir" class=" select-custom" (change)="onTamanhoPaginaChange($event)">

        <option value="10">Exibir 10</option>
        <option value="5">Exibir 5</option>
        <option value="2">Exibir 2</option>
      </select>
    </div>
  </div>


  <div class="cards-container">
    <app-card-veiculo *ngFor="let veiculo of paginacaoVeiculos.itens" [veiculo]="veiculo" [portais]="portais"
    #cardveiculo>
    </app-card-veiculo>
  </div>

</section>
<app-paginacao [paginaAtual]="paginacaoVeiculos.paginaAtual" [totalPaginas]="paginacaoVeiculos.totalPaginas"
  (paginaMudou)="onPaginaMudou($event)">
</app-paginacao>
